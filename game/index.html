<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasar Malam Rush — Dapur Gerobak</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a4d; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); display: block; touch-action: none; }
  /* Dibaca keras, tidak ditampilkan: baris status yang diumumkan screen reader. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720" aria-label="Pasar Malam Rush: masak pesanan di dapur gerobak pasar malam, ikuti rute bernomor, sajikan tepat waktu"></canvas></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
